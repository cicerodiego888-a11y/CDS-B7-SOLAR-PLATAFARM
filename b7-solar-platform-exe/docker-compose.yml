services:
  postgres:
    image: postgres:17-alpine
    container_name: b7-solar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: b7
      POSTGRES_PASSWORD: b7_password
      POSTGRES_DB: b7_solar
    ports:
      - "5432:5432"
    volumes:
      - b7_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b7 -d b7_solar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  b7_postgres_data: